volumes:
  mongodb_vol:
  postgres_vol:
networks:
  ite-net:
    external: true

services:
  postgres:
    image: postgres:17
    container_name: istad-order-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: istad_order
      POSTGRES_USER: istad
      POSTGRES_PASSWORD: istad
    volumes:
      - postgres_vol:/var/lib/postgresql/data
    networks:
      - ite-net

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "2026:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongod
      - MONGO_INITDB_ROOT_PASSWORD=mongod
    volumes:
      - mongodb_vol:/data/db
    networks:
      ite-net:
