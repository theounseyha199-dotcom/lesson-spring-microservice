volumes:
  ite-pg-vol:
    driver: local
networks:
  ite-net:
    external: true
services:
  ite-postgres:
    container_name: ite-postgres
    image: postgres:18.4
    ports:
      - "9543:5432"
    environment:
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD before starting PostgreSQL}
      POSTGRES_USER: iteuser
    volumes:
      - ite-pg-vol:/var/lib/postgresql/18/docker
      - ./init_db/:/docker-entrypoint-initdb.d
    networks:
      - ite-net
