server:
  port: ${PAYMENT_PORT:8083}
spring:
  application:
    name: payment-service
  mongodb:
    uri: ${PAYMENT_MONGO_URI:mongodb://mongod:mongod@localhost:2026/istad_payment?authSource=admin}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info
management:
  endpoints:
    web:
      exposure:
        include: health,info
---
# Use the same profile on the registry for the local failure demonstration.
spring:
  config:
    activate:
      on-profile: discovery-demo
  cloud:
    loadbalancer:
      cache:
        enabled: false
eureka:
  client:
    registry-fetch-interval-seconds: 5
    initial-instance-info-replication-interval-seconds: 5
    instance-info-replication-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
