spring:
  config:
    import:
      - optional:file:./.local/runtime.properties
      - optional:file:../../.local/runtime.properties

  application:
    name: iam-service
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${IAM_GITHUB_CLIENT_ID}
            client-secret: ${IAM_GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          google:
            client-id: ${IAM_GOOGLE_CLIENT_ID}
            client-secret: ${IAM_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"



  datasource:
    url: ${IAM_DB_URL:jdbc:postgresql://localhost:9543/db_oauth2}
    username: ${IAM_DB_USER:iteuser}
    password: ${IAM_DB_PASSWORD:qwerqwer}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${IAM_PORT:9000}

app:
  iam:
    issuer: ${IAM_ISSUER:http://localhost:${server.port}}
    signing-key-file: ${IAM_SIGNING_KEY_FILE:./.local/iam-signing-key.json}
    username: ${IAM_USERNAME:user}
    password: ${IAM_PASSWORD:password}
    client-id: ${IAM_CLIENT_ID:oidc-client}
    client-secret: ${IAM_CLIENT_SECRET:secret}
    redirect-uri: ${IAM_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/oidc-client}
    postman-redirect-uri: ${IAM_POSTMAN_REDIRECT_URI:https://oauth.pstmn.io/v1/browser-callback}
    logout-redirect-uri: ${IAM_LOGOUT_REDIRECT_URI:http://127.0.0.1:8080/}
