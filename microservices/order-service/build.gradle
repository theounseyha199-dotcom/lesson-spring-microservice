plugins { id 'java-common-conventions' }

// Composite-build task references target the root, so aggregate every module.
['assemble', 'check', 'build', 'test'].each { taskName ->
    def aggregate = tasks.findByName(taskName) ?: tasks.create(taskName)
    aggregate.dependsOn subprojects.collect { project ->
        project.tasks.matching { it.name == taskName }
    }
}

// Resolve catalog coordinates to the modules in this build.
allprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('kh.edu.istad:order-application-service') using project(':order-service-domain:order-application-service')
            substitute module('kh.edu.istad:order-domain-core') using project(':order-service-domain:order-domain-core')
        }
    }
}
