#server:
#  port: 8081

spring:
  application:
    name: order-service

  profiles:
    active: dev

  config:
    import: "optional:consul:"

  # PostgreSQL - Reactive
  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer

  # Liquibase - temporarily disabled
  liquibase:
    enabled: true
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # MongoDB
  mongodb:
    uri: mongodb://mongod:mongod@localhost:2026/istad_order?authSource=admin
    representation:
      uuid: standard

  cloud:
    discovery:
      enabled: true

    consul:
      host: localhost
      port: 8500

      config:
        enabled: true
        prefix: config
        format: YAML
        data-key: data
        watch:
          enabled: true
          # Complete blocking queries before the HTTP client's 10-second timeout.
          wait-time: 5

      discovery:
        enabled: true
        register: true
        service-name: order-service
        health-check-path: /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: discovery-demo

  cloud:
    loadbalancer:
      cache:
        enabled: false
