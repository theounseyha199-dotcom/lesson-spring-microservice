plugins {
    id 'discovery-client-conventions'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


    implementation project(':customer-service-domain:customer-domain-core')
    implementation project(':customer-service-domain:customer-application-service')
    implementation project(':customer-service-message')
    implementation project(':customer-service-persistence')
    implementation project(':customer-service-restapi')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
}
