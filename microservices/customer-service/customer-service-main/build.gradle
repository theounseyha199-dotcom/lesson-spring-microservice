plugins {
    id 'spring-boot-common-conventions'
}

dependencies {

    implementation project(':customer-service-domain:customer-domain-core')
    implementation project(':customer-service-domain:customer-application-service')
    implementation project(':customer-service-message')
    implementation project(':customer-service-persistence')
    implementation project(':customer-service-restapi')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
