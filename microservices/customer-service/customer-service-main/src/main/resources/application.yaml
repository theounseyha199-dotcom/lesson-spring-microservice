server:
  port: ${CUSTOMER_PORT:8084}

spring:
  application:
    name: customer-service
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  config:
    import: optional:file:./microservices/customer-service/.env.local[.properties]
  # Legacy PostgreSQL settings and schema.sql are retained for reference.
  # datasource:
  #   url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/istad_customer}
  #   username: ${CUSTOMER_DB_USERNAME}
  #   password: ${CUSTOMER_DB_PASSWORD}
  # sql:
  #   init:
  #     mode: always
  #     schema-locations: classpath:schema.sql
  mongodb:
    uri: ${CUSTOMER_MONGO_URI:mongodb://mongod:mongod@localhost:2026/istad_customer?authSource=admin}
