plugins {
    id 'base'
}

group = 'kh.edu.istad'
version = '1.0.0'

subprojects {
    group = rootProject.group
    version = rootProject.version
}

tasks.named('assemble') {
    dependsOn subprojects.collect { it.path + ':assemble' }
}

tasks.named('check') {
    dependsOn subprojects.collect { it.path + ':check' }
}
